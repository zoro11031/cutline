<?xml version="1.0" encoding="UTF-8"?>
<!-- cutline: a card with a cut line and a registration mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4252"/>
      <stop offset="1" stop-color="#232834"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="#12151c"/>

  <!-- the card -->
  <rect x="30" y="22" width="56" height="78" rx="6"
        fill="url(#card)" stroke="#5b6679" stroke-width="2"/>

  <!-- the cut outline, offset, in the suite's amber -->
  <rect x="38" y="30" width="56" height="78" rx="6"
        fill="none" stroke="#e0a33a" stroke-width="3"
        stroke-dasharray="9 5" stroke-linecap="round"/>

  <!-- registration marks: square top-left, L bottom-right -->
  <rect x="16" y="16" width="11" height="11" fill="#e8ebf2"/>
  <g stroke="#e8ebf2" stroke-width="4" stroke-linecap="butt">
    <path d="M112 101 L112 112"/>
    <path d="M101 112 L112 112"/>
  </g>
</svg>
