name: Release

# Builds every package on each version tag and publishes a release.
on:
  push:
    tags: ["v*"]
    # A release branch builds and checks every package without publishing.
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned AppImage type2 runtime (AppImage/type2-runtime release 20251108).
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  tests:
    # Arch carries current Qt, GTK 4 and libadwaita, so both windows' tests run.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 python-gobject python-cairo \
            python-pillow python-pyusb gtk4 libadwaita geos poppler librsvg ttf-dejavu \
            xorg-server-xvfb
      - uses: actions/checkout@v7
      - name: Run the offline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./run-tests.sh

  linux:
    # Build the AppImage with Arch's Qt and GTK libraries.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          # The container skips licence files; the AppImage must ship them.
          # Reinstall what the image already has so its licences come back.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -Syu --noconfirm
          pacman -Qqn | pacman -S --noconfirm -
          pacman -S --noconfirm --needed licenses git curl \
            python pyside6 qt6-svg python-gobject python-cairo python-pillow python-pyusb \
            gtk4 libadwaita pango cairo geos libusb poppler librsvg \
            squashfs-tools desktop-file-utils glib2 ttf-dejavu
      - uses: actions/checkout@v7
      - name: AppImage
        run: |
          curl -fsSL -o runtime-x86_64 "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  runtime-x86_64" | sha256sum -c
          python3 packaging/build-appimage.py --runtime runtime-x86_64
      - name: Check the AppImage payload and a dry-run cut
        run: |
          image=$(ls out/packages/Cutline-*-x86_64.AppImage)
          mkdir -p out/appimage-smoke && cd out/appimage-smoke
          "../../$image" --appimage-extract >/dev/null
          cd ../..
          python3 packaging/smoke-appdir.py out/appimage-smoke/squashfs-root --skip-usb-init
          "$image" --appimage-extract-and-run cut --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/packages/Cutline-*-x86_64.AppImage

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak and the GNOME 50 SDK
        run: |
          # bubblewrap needs unprivileged user namespaces, which the runner's
          # AppArmor profile restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # --device=usb needs Flatpak 1.15.11 or newer; Ubuntu 24.04 ships 1.14.
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          # The SVG pixbuf loader lets flatpak validate the app's SVG icon.
          sudo apt-get install -y flatpak librsvg2-common
          flatpak --version
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50
      - name: Build the Flatpak (includes a dry-run cut)
        env:
          SCC_FLATPAK_BUILD_SHARE_NETWORK: "1"
        run: sh packaging/build-flatpak.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: out/packages/Cutline-*-x86_64.flatpak

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zstd libglib2.0-bin librsvg2-bin python3-pil
      - name: Build the Windows installer
        run: python3 packaging/build-windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/packages/Cutline-*-Windows-x86_64-Setup.exe

  windows-check:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: Verify fresh installation and in-place upgrades
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem Cutline-*-Setup.exe).FullName
          $expected = [regex]::Match((Split-Path $setup -Leaf), 'Cutline-(\d+\.\d+\.\d+)-').Groups[1].Value
          $default = Join-Path $env:LOCALAPPDATA 'Programs\Cutline'
          $custom = Join-Path $env:LOCALAPPDATA 'Cutline Custom Install'
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Cutline'
          $data = New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'Cutline')
          Set-Content (Join-Path $data 'settings.json') '{"speed":22}'
          $env:CUTLINE_CONFIG = $data.FullName

          function Run-Setup($file, $arguments = '/S', $expectedExit = 0) {
            $process = Start-Process $file -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne $expectedExit) { throw "Unexpected setup exit code $($process.ExitCode)" }
          }

          function Check-Install($folder) {
            $entry = Get-ItemProperty $registry
            if ($entry.InstallLocation -ne $folder -or $entry.DisplayVersion -ne $expected) {
              throw "Wrong installation location or version: $($entry.InstallLocation), $($entry.DisplayVersion)"
            }
            $app = Join-Path $folder 'app'
            & "$app\python.exe" "$app\launcher.py" cut --dry-run
            if ($LASTEXITCODE) { throw "Cut dry run failed" }
            & "$app\python.exe" -c "import sys; sys.path.insert(0, r'$app'); from PySide6.QtWidgets import QApplication; from cutline import __version__, qt_gui, windows_update; assert __version__ == '$expected'; app = QApplication([]); assert windows_update.installed(); window = qt_gui.Window(); window.show(); app.processEvents()"
            if ($LASTEXITCODE) { throw "Qt startup failed" }
          }

          Run-Setup $setup
          Check-Install $default
          Run-Setup "$default\Uninstall.exe"

          foreach ($case in @(
            @{ Version = '0.3.0'; Folder = $default; Args = '/S'; SHA = '3f7c404a60514d77ac0c70640d984f4dad1470cbeb72049adae581bd5908b96a' },
            @{ Version = '0.3.1'; Folder = $custom; Args = "/S /D=$custom"; SHA = '0f26641b66fb08bae81c4aeef5173bb7598e978ebf5615d5947ccd5fe3ab3ce3' }
          )) {
            $name = "Cutline-$($case.Version)-Windows-x86_64-Setup.exe"
            $url = "https://github.com/zoro11031/cutline/releases/download/v$($case.Version)"
            $previous = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "$url/$name" -OutFile $previous
            if ((Get-FileHash $previous).Hash -ne $case.SHA) { throw "Baseline checksum failed" }
            Run-Setup $previous $case.Args
            $before = (Get-FileHash (Join-Path $data 'settings.json')).Hash
            $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Cutline.lnk'
            $hadShortcut = Test-Path $shortcut
            $python = Join-Path $case.Folder 'app\python.exe'
            $running = Start-Process $python -ArgumentList '-c "import time; time.sleep(90)"' -PassThru
            try {
              Start-Sleep -Seconds 1
              Run-Setup $setup '/S' 1
              if ((Get-ItemProperty $registry).DisplayVersion -ne $case.Version) { throw "Running app was replaced" }
            } finally {
              Stop-Process -Id $running.Id -ErrorAction SilentlyContinue
              $running.WaitForExit()
            }
            $blockedStage = New-Item -ItemType Directory (Join-Path $case.Folder 'app.new')
            Set-Content (Join-Path $blockedStage 'sentinel.txt') 'Keep this file'
            Run-Setup $setup '/S' 1
            if ((Get-ItemProperty $registry).DisplayVersion -ne $case.Version -or
                -not (Test-Path (Join-Path $blockedStage 'sentinel.txt'))) {
              throw "A failed replacement modified the existing installation"
            }
            Remove-Item $blockedStage -Recurse
            Run-Setup $setup
            if ((Get-FileHash (Join-Path $data 'settings.json')).Hash -ne $before) { throw "Setup changed saved settings" }
            if ((Test-Path $shortcut) -ne $hadShortcut) { throw "Shortcut preference changed" }
            Check-Install $case.Folder
            Run-Setup "$($case.Folder)\Uninstall.exe"
          }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, linux, flatpak, windows-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/install-cutline.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          # Release notes are the tag's message.
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cutline ${GITHUB_REF_NAME#v}" --notes-file notes.txt
